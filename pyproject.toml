[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stlmodel"
version = "0.1.0"
description = "A local text-conditioned voxel generation research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2,<3",
  "scikit-image>=0.25,<0.27",
  "trimesh>=4.6,<6",
  "pynrrd>=1.1,<2",
  "sentence-transformers>=3.4,<6",
  "gradio>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[project.scripts]
stlmodel = "stlmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
